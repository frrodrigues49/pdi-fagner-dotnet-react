# Dois jeitos de subir:
#
#   docker compose up -d                    só a infraestrutura (Kafka, Mongo, Oracle):
#                                           para rodar as APIs/Worker com `dotnet run`
#   docker compose --profile app up -d      TUDO em container: infra + 2 APIs + Worker + tela
#
# Valores sensíveis podem ser sobrescritos por variável de ambiente (ou arquivo .env):
#   INTERNAL_API_KEY, AUTH_SIGNING_KEY

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development # Swagger ligado para a demo
  Kafka__BootstrapServers: kafka:29092
  Mongo__ConnectionString: mongodb://mongo:27017

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: pdi-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dois listeners: PLAINTEXT (localhost:9092) para quem roda na máquina (dotnet run)
      # e INTERNAL (kafka:29092) para quem roda dentro da rede do compose.
      # O broker devolve ao cliente o endereço "anunciado"; com um só listener em
      # localhost, um container tentaria falar com ele mesmo e falharia.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Cria os tópicos (e as DLQs) antes de qualquer consumer subir. Roda uma vez e sai.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: pdi-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BIN=/opt/kafka/bin
        for t in proposta-conta-finalizada proposta-conta-aprovada proposta-conta-rejeitada criar-conta; do
          for name in $$t $$t.dlq; do
            $$BIN/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
              --topic $$name --partitions 3 --replication-factor 1
          done
        done
        $$BIN/kafka-topics.sh --bootstrap-server kafka:29092 --list

  mongo:
    image: mongo:7
    container_name: pdi-mongo
    ports:
      - "27017:27017"
    volumes:
      - pdi_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: pdi-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: pdi # senha do SYS/SYSTEM
      APP_USER: pdi # cria o schema "PDI" para nossas tabelas
      APP_USER_PASSWORD: pdi
    volumes:
      - pdi_oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------- aplicações

  onboarding-api:
    profiles: [app]
    build:
      context: .
      dockerfile: src/Pdi.Onboarding.Api/Dockerfile
    image: ${IMAGE_PREFIX:-pdi}/onboarding-api:${IMAGE_TAG:-local}
    container_name: pdi-onboarding-api
    environment:
      <<: *dotnet-env
      Mongo__Database: precadastro
    ports:
      - "5003:8080"
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  antifraude-api:
    profiles: [app]
    build:
      context: .
      dockerfile: src/Pdi.Antifraude.Api/Dockerfile
    image: ${IMAGE_PREFIX:-pdi}/antifraude-api:${IMAGE_TAG:-local}
    container_name: pdi-antifraude-api
    environment:
      <<: *dotnet-env
      Mongo__Database: antifraude
      InternalApi__Key: ${INTERNAL_API_KEY:-dev-internal-key-troque-em-producao}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-dev-only-signing-key-troque-em-producao-0123456789}
    ports:
      - "5004:8080"
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: src/Pdi.Onboarding.Worker/Dockerfile
    image: ${IMAGE_PREFIX:-pdi}/worker:${IMAGE_TAG:-local}
    container_name: pdi-worker
    environment:
      DOTNET_ENVIRONMENT: Production
      Kafka__BootstrapServers: kafka:29092
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: precadastro
      ConnectionStrings__Accounts: User Id=pdi;Password=pdi;Data Source=oracle:1521/FREEPDB1
      Antifraude__BaseUrl: http://antifraude-api:8080
      Antifraude__InternalApiKey: ${INTERNAL_API_KEY:-dev-internal-key-troque-em-producao}
    depends_on:
      mongo:
        condition: service_healthy
      oracle:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      antifraude-api:
        condition: service_started
    restart: unless-stopped

  # Tela de aprovação: nginx serve o build do React e faz proxy das duas APIs
  # (mesma origem → sem CORS). /onboarding/* → onboarding-api, /antifraude/* → antifraude-api
  web:
    profiles: [app]
    build:
      context: web/antifraude-ui
    image: ${IMAGE_PREFIX:-pdi}/web:${IMAGE_TAG:-local}
    container_name: pdi-web
    ports:
      - "8080:80"
    depends_on:
      - onboarding-api
      - antifraude-api
    restart: unless-stopped

volumes:
  pdi_mongo_data:
  pdi_oracle_data:
