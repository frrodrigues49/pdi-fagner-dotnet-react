services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: pdi-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Cria os tópicos (e as DLQs) antes de qualquer consumer subir. Roda uma vez e sai.
  # network_mode service:kafka = mesmo "localhost" do broker, então o listener
  # anunciado (localhost:9092) funciona daqui de dentro.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: pdi-kafka-init
    network_mode: service:kafka
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BIN=/opt/kafka/bin
        until $$BIN/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; do
          echo "waiting for kafka..."; sleep 2
        done
        for t in proposta-conta-finalizada proposta-conta-aprovada proposta-conta-rejeitada criar-conta; do
          for name in $$t $$t.dlq; do
            $$BIN/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists \
              --topic $$name --partitions 3 --replication-factor 1
          done
        done
        $$BIN/kafka-topics.sh --bootstrap-server localhost:9092 --list

  mongo:
    image: mongo:7
    container_name: pdi-mongo
    ports:
      - "27017:27017"
    volumes:
      - pdi_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: pdi-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: pdi # senha do SYS/SYSTEM
      APP_USER: pdi # cria o schema "PDI" para nossas tabelas
      APP_USER_PASSWORD: pdi
    volumes:
      - pdi_oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pdi_mongo_data:
  pdi_oracle_data:
