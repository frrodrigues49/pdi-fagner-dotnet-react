server {
  listen 80;
  root /usr/share/nginx/html;

  # DNS interno do Docker, reconsultado a cada 10s. Com o upstream numa variável o nginx
  # resolve o nome em tempo de execução; sem isso ele guarda o IP do boot e, se o container
  # da API for recriado (IP novo), passa a responder 502.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Proxy para as APIs: a tela fala só com a própria origem (sem CORS).
  # O rewrite remove o prefixo: /antifraude/api/v1/... → /api/v1/...
  # HTTP/1.1 para o backend: o padrão do nginx é 1.0, e o Kestrel recusa (400) um POST
  # HTTP/1.0 sem corpo/Content-Length (ex.: POST /finalize, POST /approve).
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /onboarding/ {
    set $onboarding http://onboarding-api:8080;
    rewrite ^/onboarding/(.*)$ /$1 break;
    proxy_pass $onboarding;
    proxy_set_header Host $host;
  }

  location /antifraude/ {
    set $antifraude http://antifraude-api:8080;
    rewrite ^/antifraude/(.*)$ /$1 break;
    proxy_pass $antifraude;
    proxy_set_header Host $host;
  }

  # SPA: qualquer rota desconhecida (ex.: /analises/123) devolve o index.html
  location / {
    try_files $uri /index.html;
  }
}
