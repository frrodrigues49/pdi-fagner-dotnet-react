server {
  listen 80;
  root /usr/share/nginx/html;

  # Proxy para as APIs: a tela fala só com a própria origem (sem CORS).
  # A barra final em proxy_pass remove o prefixo: /antifraude/api/v1/... → /api/v1/...
  # HTTP/1.1 para o backend: o padrão do nginx é 1.0, e o Kestrel recusa (400) um POST
  # HTTP/1.0 sem corpo/Content-Length (ex.: POST /finalize, POST /approve).
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /onboarding/ {
    proxy_pass http://onboarding-api:8080/;
    proxy_set_header Host $host;
  }

  location /antifraude/ {
    proxy_pass http://antifraude-api:8080/;
    proxy_set_header Host $host;
  }

  # SPA: qualquer rota desconhecida (ex.: /analises/123) devolve o index.html
  location / {
    try_files $uri /index.html;
  }
}
